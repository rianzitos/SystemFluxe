; Catraca RFID — PlatformIO (extensão do VS Code ou "pio" no terminal)
; Abra ESTA pasta (iot/esp32_catraca) no VS Code e use Build (✓) e Upload (→) na barra de baixo.
; As bibliotecas abaixo são baixadas sozinhas na primeira compilação (mesmas do libraries.txt do Wokwi).
[platformio]
src_dir = .

[env:esp32]
platform = espressif32@6.10.0
board = esp32doit-devkit-v1
framework = arduino
lib_deps =
  miguelbalboa/MFRC522@1.4.11
  madhephaestus/ESP32Servo@3.0.6
  bblanchon/ArduinoJson@7.4.2
monitor_speed = 115200
