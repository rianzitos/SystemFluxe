; Catraca RFID — PlatformIO (extensão do VS Code ou "pio" no terminal)
; Abra ESTA pasta (iot/esp32_catraca) no VS Code e use Build (✓) e Upload (→) na barra de baixo.
; As bibliotecas abaixo são baixadas sozinhas na primeira compilação (mesmas do libraries.txt do Wokwi).
[platformio]
src_dir = .

[env:esp32]
platform = espressif32@6.10.0
board = esp32doit-devkit-v1
framework = arduino
lib_deps =
  miguelbalboa/MFRC522@1.4.11
  madhephaestus/ESP32Servo@3.0.6
  bblanchon/ArduinoJson@7.4.2
monitor_speed = 115200
; Monitor Serial com DTR e RTS desligados: abrir o monitor não reinicia nem segura a ESP32 em reset
; (na DevKit esses sinais comandam o EN e o IO0). Para ver o boot desde o começo, aperte o botão EN.
monitor_rts = 0
monitor_dtr = 0
; Se a placa travar, o monitor mostra em que linha do código foi.
monitor_filters = esp32_exception_decoder
